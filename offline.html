<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Offline — KrishiKonnect</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f7fdf8;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border: 1px solid #c8e6c9;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }
    .emoji { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 22px; color: #1b4332; margin-bottom: 8px; }
    p  { font-size: 15px; color: #4a5568; line-height: 1.6; margin-bottom: 16px; }
    .tip {
      background: #d8f3dc;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 13px;
      color: #2d6a4f;
      margin-bottom: 24px;
      text-align: left;
    }
    .tip strong { display: block; margin-bottom: 4px; }
    button {
      background: #2d6a4f;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button:hover { background: #1b4332; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">📵</div>
    <h1>You're Offline</h1>
    <p>KrishiKonnect needs an internet connection for AI diagnosis and live mandi prices.</p>
    <div class="tip">
      <strong>✅ Available offline:</strong>
      Your previously loaded crop reports and saved farm data are still accessible from the main screen.
    </div>
    <button onclick="window.location.reload()">🔄 Try Again</button>
  </div>
</body>
</html>
